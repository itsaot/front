<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>API Validation Portal</title>

<style>
:root {
  --primary: #111827;
  --accent: #2563eb;
  --success: #16a34a;
  --error: #dc2626;
  --bg: #f9fafb;
}

body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: var(--bg);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.card {
  background: white;
  padding: 40px;
  border-radius: 16px;
  width: 420px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}

h2 {
  text-align: center;
  margin-bottom: 25px;
  color: var(--primary);
}

label {
  font-size: 14px;
  font-weight: 600;
  display: block;
  margin-bottom: 6px;
}

input {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #d1d5db;
  font-size: 14px;
  transition: 0.2s;
}

input.valid {
  border-color: var(--success);
}

input.invalid {
  border-color: var(--error);
}

.feedback {
  font-size: 12px;
  margin-bottom: 15px;
  display: none;
}

.feedback.success {
  color: var(--success);
}

.feedback.error {
  color: var(--error);
}

button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 8px;
  background: var(--accent);
  color: white;
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.spinner {
  display: none;
  margin: 15px auto;
  width: 30px;
  height: 30px;
  border: 4px solid #e5e7eb;
  border-top: 4px solid var(--accent);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.checkmark {
  display: none;
  margin: 20px auto;
  width: 80px;
  height: 80px;
}

.checkmark svg {
  width: 100%;
  height: 100%;
}

.checkmark circle {
  stroke: var(--success);
  stroke-width: 4;
  fill: none;
}

.checkmark path {
  stroke: var(--success);
  stroke-width: 4;
  fill: none;
  stroke-dasharray: 100;
  stroke-dashoffset: 100;
  animation: draw 0.6s ease forwards;
}

@keyframes draw {
  to { stroke-dashoffset: 0; }
}

.status {
  text-align: center;
  font-size: 14px;
  margin-top: 10px;
}

pre {
  margin-top: 20px;
  background: #111827;
  color: #f9fafb;
  padding: 12px;
  border-radius: 8px;
  font-size: 12px;
  max-height: 200px;
  overflow: auto;
}
</style>
</head>

<body>

<div class="card">
  <h2>Application Validation</h2>

  <label>Email Address</label>
  <input type="email" id="email" placeholder="your@email.com">
  <div id="emailFeedback" class="feedback"></div>

  <label>API Endpoint URL</label>
  <input type="url" id="url" placeholder="https://your-api.com/webhook">
  <div id="urlFeedback" class="feedback"></div>

  <button id="validateBtn" onclick="validate()">Validate Endpoint</button>

  <div class="spinner" id="spinner"></div>

  <div class="checkmark" id="checkmark">
    <svg viewBox="0 0 52 52">
      <circle cx="26" cy="26" r="24"></circle>
      <path d="M14 27 L22 35 L38 19"></path>
    </svg>
  </div>

  <div class="status" id="status"></div>

  <pre id="result"></pre>
</div>

<script>
const emailInput = document.getElementById("email");
const urlInput = document.getElementById("url");

emailInput.addEventListener("input", () => validateEmail());
urlInput.addEventListener("input", () => validateURL());

function validateEmail() {
  const feedback = document.getElementById("emailFeedback");
  const value = emailInput.value;

  if (!value) {
    feedback.style.display = "none";
    emailInput.classList.remove("valid", "invalid");
    return false;
  }

  const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);

  if (valid) {
    feedback.textContent = "Valid email address";
    feedback.className = "feedback success";
    emailInput.classList.add("valid");
    emailInput.classList.remove("invalid");
  } else {
    feedback.textContent = "Please enter a valid email";
    feedback.className = "feedback error";
    emailInput.classList.add("invalid");
    emailInput.classList.remove("valid");
  }

  feedback.style.display = "block";
  return valid;
}

function validateURL() {
  const feedback = document.getElementById("urlFeedback");
  const value = urlInput.value;

  if (!value) {
    feedback.style.display = "none";
    urlInput.classList.remove("valid", "invalid");
    return false;
  }

  try {
    new URL(value);
    feedback.textContent = "Valid URL";
    feedback.className = "feedback success";
    urlInput.classList.add("valid");
    urlInput.classList.remove("invalid");
    feedback.style.display = "block";
    return true;
  } catch {
    feedback.textContent = "Please enter a valid URL";
    feedback.className = "feedback error";
    urlInput.classList.add("invalid");
    urlInput.classList.remove("valid");
    feedback.style.display = "block";
    return false;
  }
}

async function validate() {
  if (!validateEmail() || !validateURL()) return;

  const button = document.getElementById("validateBtn");
  const spinner = document.getElementById("spinner");
  const checkmark = document.getElementById("checkmark");
  const status = document.getElementById("status");
  const result = document.getElementById("result");

  button.disabled = true;
  spinner.style.display = "block";
  checkmark.style.display = "none";
  status.textContent = "";
  result.textContent = "";

  const validationUrl =
    `https://yhxzjyykdsfkdrmdxgho.supabase.co/functions/v1/application-task?url=${encodeURIComponent(urlInput.value)}&email=${encodeURIComponent(emailInput.value)}`;

  try {
    const response = await fetch(validationUrl);
    const data = await response.json();

    spinner.style.display = "none";
    button.disabled = false;

    if (response.ok) {
      checkmark.style.display = "block";
      status.textContent = "Validation Successful!";
      status.style.color = "var(--success)";
    } else {
      status.textContent = "Validation Failed.";
      status.style.color = "var(--error)";
    }

    result.textContent = JSON.stringify(data, null, 2);

  } catch {
    spinner.style.display = "none";
    button.disabled = false;
    status.textContent = "Could not reach validation service.";
    status.style.color = "var(--error)";
  }
}
</script>

</body>
</html>
